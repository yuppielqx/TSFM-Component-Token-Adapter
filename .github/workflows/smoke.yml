name: Offline smoke checks

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q models data_provider utils scripts tests train_component_prototypes.py train_component_token_adapter.py eval_component_token_adapter_rollout.py
          bash -n script/train_component_codebooks.sh script/run_chronos_bolt.sh
      - name: Exercise offline data and model paths
        run: python -m unittest discover -s tests -v
